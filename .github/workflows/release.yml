name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w -X job/internal/cli.version=${{ github.ref_name }}" -o job-darwin-${{ matrix.goarch }} .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: job-darwin-${{ matrix.goarch }}
